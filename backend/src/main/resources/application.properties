spring.application.name=coopa

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/mapa_hexa}
spring.data.mongodb.database=mapa_hexa

jwt.secret=${JWT_SECRET:coopa-secret-key-minimo-512-bits-para-hs512-algoritmo-seguro-use-openssl-rand-base64-64}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://mapa-do-hexa-five.vercel.app,http://localhost:5173,http://localhost,http://localhost:80,http://frontend,http://127.0.0.1}
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.enabled=true

server.port=${PORT:8080}
spring.mvc.pathmatch.matching-strategy=ant_path_matcher